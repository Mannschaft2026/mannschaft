name: Task-List PR Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: task-list-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  task-list-pr-gate:
    name: Task-List PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # rerun は古いペイロード（title/body/base.sha）で走る既知事象があるため、最初に pulls.get で最新の PR を取り、
      # その最新 base.sha を checkout する（ペイロードの base.sha で先に checkout しない）。
      - name: Fetch latest pull request
        id: latest
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            const payloadPull = context.payload.pull_request;
            if (!payloadPull) throw new Error('pull_request payload is missing');
            const { owner, repo } = context.repo;
            const maxAttempts = 6;
            let latest;
            for (let attempt = 1; ; attempt++) {
              latest = (await github.rest.pulls.get({ owner, repo, pull_number: payloadPull.number })).data;
              // 実行コードの取得元は、この repo の保護された main に限る（base を未レビューの別ブランチへ変えた PR のコードを実行しない）。
              if (latest.base.repo?.full_name !== `${owner}/${repo}` || latest.base.ref !== 'main') {
                throw new Error(`The PR base must be main of ${owner}/${repo} (got ${latest.base.repo?.full_name}:${latest.base.ref}); the trusted checker is never loaded from another branch.`);
              }
              if (latest.head.sha === payloadPull.head.sha) break;
              // head が食い違う。実際のブランチ ref で「payload が古い run」と「API の反映遅れ」を区別する。
              const headRepo = payloadPull.head.repo;
              if (!headRepo) throw new Error('The PR head repository is unavailable; the head ref cannot be verified.');
              const refResponse = await github.rest.git.getRef({ owner: headRepo.owner.login, repo: headRepo.name, ref: `heads/${payloadPull.head.ref}` });
              if (refResponse.data.object.sha !== payloadPull.head.sha) {
                core.notice(`PR head moved (${payloadPull.head.sha} -> ${refResponse.data.object.sha}); this run is stale and a newer run decides.`);
                core.setOutput('stale', 'true');
                return;
              }
              // ref は payload と同じ head のまま、pulls.get だけが旧 head を返している（反映遅れ）。上限付きで取り直す。
              if (attempt >= maxAttempts) throw new Error(`pulls.get kept returning a different head (${latest.head.sha}) than the branch ref (${payloadPull.head.sha}) after ${maxAttempts} attempts; the PR cannot be verified.`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setOutput('base_sha', latest.base.sha);
            core.setOutput('pull', JSON.stringify({ number: latest.number, title: latest.title, body: latest.body, created_at: latest.created_at, changed_files: latest.changed_files, user: latest.user ? { login: latest.user.login, type: latest.user.type } : null, base: { sha: latest.base.sha, ref: latest.base.ref }, head: { sha: latest.head.sha } }));

      # pull_request_target では必ず信頼 base SHA（最新）をcheckoutする。PRのソースはcheckout/import/実行しない。
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest.outputs.base_sha || github.sha }}
          persist-credentials: false

      - name: Validate registration and completion evidence
        if: steps.latest.outputs.stale != 'true'
        uses: actions/github-script@v9
        env:
          LATEST_PULL: ${{ steps.latest.outputs.pull }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const rolloutAt = Date.parse('2026-10-07T02:51:05Z');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/main') {
                core.setFailed('Legacy check backfill may only run from main.');
                return;
              }
              const openPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
              let backfilled = 0;
              let failed = 0;
              for (const legacyPull of openPulls.filter(pr => Date.parse(pr.created_at) < rolloutAt)) {
                const existingChecks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: legacyPull.head.sha, per_page: 100 });
                if (existingChecks.some(check => check.name === 'Task-List PR Gate' && check.conclusion === 'success')) continue;
                try {
                  await github.rest.checks.create({ owner, repo, name: 'Task-List PR Gate', head_sha: legacyPull.head.sha, status: 'completed', conclusion: 'success', output: {
                    title: 'Legacy PR migration grace', summary: `PR #${legacyPull.number} predates ${new Date(rolloutAt).toISOString()} and is grandfathered for registration.`
                  }});
                  backfilled++;
                } catch (error) { core.error(`Could not backfill PR #${legacyPull.number}: ${error.message}`); failed++; }
              }
              if (failed) core.setFailed('One or more legacy PR checks could not be backfilled.');
              else core.info(`Backfilled ${backfilled} legacy check(s).`);
              return;
            }

            const payloadPull = context.payload.pull_request;
            if (!payloadPull) throw new Error('pull_request payload is missing');
            // 判定は取得ステップで確認済みの最新の PR（title/body/base.sha/head.sha）で行う。base.sha は checkout 済みの信頼 base と同じ。
            const pull = process.env.LATEST_PULL ? JSON.parse(process.env.LATEST_PULL) : payloadPull;
            const { pathToFileURL } = require('node:url');
            const validatorPath = path.join(process.cwd(), 'scripts', 'completion-evidence.mjs');
            const validatorAvailable = fs.existsSync(validatorPath);
            // 台帳の両配置（旧: docs/task-list.md 1ファイル / 新: 索引＋docs/task-list/YYYY-MM.md・legacy.md）と変更申告（docs/task-list/changes/）は
            // 信頼 base の scripts/task-list-ledger.mjs（readLedger）で実効台帳として読む。取得は scripts/task-list-pr-gate.mjs の GraphQL Tree entries 一括取得
            // （1参照1回・blob は oid でキャッシュ）で、呼び出し数は申告の件数に依らない。null・取得失敗（5xx 等）は不在とせず例外にする（CMP-261124-1222 ④）。
            const ledgerLibPath = path.join(process.cwd(), 'scripts', 'task-list-ledger.mjs');
            if (!fs.existsSync(ledgerLibPath)) throw new Error('The trusted ledger reader scripts/task-list-ledger.mjs is absent from the base checkout.');
            const ledgerLib = await import(pathToFileURL(ledgerLibPath).href);
            const gateLibPath = path.join(process.cwd(), 'scripts', 'task-list-pr-gate.mjs');
            if (!fs.existsSync(gateLibPath)) throw new Error('The trusted ledger gate library scripts/task-list-pr-gate.mjs is absent from the base checkout.');
            const gateLib = await import(pathToFileURL(gateLibPath).href);
            const ledgerSource = gateLib.createGraphqlLedgerSource({ github, owner, repo });
            async function readContent(filePath, ref) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path: filePath, ref });
                if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error(`Expected a file: ${filePath}@${ref}`);
                if (response.data.encoding === 'base64') return Buffer.from(response.data.content, 'base64').toString('utf8');
                // 1MiB 超のファイルは contents API が encoding:"none" で本文を返さない。blob API（100MB まで）で読む。
                if (response.data.encoding !== 'none' || !response.data.sha) throw new Error(`Expected a base64 file: ${filePath}@${ref}`);
                const blob = await github.rest.git.getBlob({ owner, repo, file_sha: response.data.sha });
                if (blob.data.encoding !== 'base64') throw new Error(`Expected a base64 blob: ${filePath}@${ref}`);
                return Buffer.from(blob.data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }
            async function readLedgerAt(ref, label) {
              try {
                return await ledgerSource.read(ref);
              } catch (error) {
                throw new Error(`The task list could not be read from ${label} (${ref}): ${error.message}`);
              }
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pull.number, per_page: 100 });
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 0 || files.length !== pull.changed_files) {
              throw new Error(`PR file list is incomplete or its count is invalid (${files.length}/${pull.changed_files}); evidence changes cannot be determined.`);
            }
            const validatorPathInBase = 'scripts/completion-evidence.mjs';
            const validatorRemoval = files.find(file =>
              file.filename === validatorPathInBase && file.status === 'removed'
              || file.previous_filename === validatorPathInBase
            );
            if (validatorRemoval) throw new Error('The trusted completion validator cannot be deleted or renamed.');
            const ledgerLibPathInBase = 'scripts/task-list-ledger.mjs';
            const ledgerLibRemoval = files.find(file =>
              file.filename === ledgerLibPathInBase && file.status === 'removed'
              || file.previous_filename === ledgerLibPathInBase
            );
            if (ledgerLibRemoval) throw new Error('The trusted ledger reader cannot be deleted or renamed.');
            const trustedPathsInBase = ['scripts/task-list-pr-gate.mjs', 'scripts/task-list-structure-check.mjs'];
            const gateLibRemoval = files.find(file =>
              trustedPathsInBase.includes(file.filename) && file.status === 'removed'
              || trustedPathsInBase.includes(file.previous_filename)
            );
            if (gateLibRemoval) throw new Error('The trusted ledger gate library cannot be deleted or renamed.');

            // base・head・分岐点それぞれの実効台帳（取得失敗・索引不在・0件は例外）。
            const baseRef = pull.base.sha;
            const headRef = pull.head.sha;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${baseRef}...${headRef}` });
            const ancestorRef = comparison.data.merge_base_commit?.sha;
            if (!/^[0-9a-f]{40}$/i.test(ancestorRef || '')) throw new Error('A valid common ancestor SHA could not be read.');
            const baseTaskList = await readLedgerAt(baseRef, 'base');
            const headTaskList = await readLedgerAt(headRef, 'PR head');
            const ancestorTaskList = await readLedgerAt(ancestorRef, 'the common ancestor');

            // 仮想 head の等式・連鎖（Codex 軍議検分 P1-1）。申告の改変・削除（畳み込み以外）と PR が足した申告の fork・孤児・重複・形式違反は赤。
            // 月別ファイルの直接編集による等式違反は互換期間（P2-4）のため notice のみ（段3で赤）。
            const ledgerChange = gateLib.evaluateLedgerChanges({ mergeBase: ancestorTaskList, base: baseTaskList, head: headTaskList, pull });
            for (const message of ledgerChange.notices) core.warning(message);
            if (ledgerChange.violations.length) {
              core.setFailed('Task list change check failed (申告は追加のみ・base 連鎖を保つこと):\n' + ledgerChange.violations.join('\n'));
              return;
            }
            if (ledgerChange.fold) core.info(`Ledger fold (畳み込み): ${ledgerChange.removedChanges.length} change file(s) folded into the month files by ${pull.user?.login ?? 'unknown'}${ledgerChange.botAuthor ? ' (ledger bot)' : ''}.`);
            core.info(`Ledger changes: +${ledgerChange.addedChanges.length} / -${ledgerChange.removedChanges.length} change file(s); ledger fetched with ${ledgerSource.stats.graphql} GraphQL call(s).`);

            let trustedValidator = null;
            if (validatorAvailable) {
              // 完了証拠の検査にも実効台帳（申告適用後）を渡す。完了 update 申告は証拠 JSON が要り、畳み込み PR は実効台帳が変わらないので選定0件。
              trustedValidator = await import(pathToFileURL(validatorPath).href);
              const evidencePathPattern = /^docs\/evidence\/CMP-(?:\d{6}-\d{4}|\d{3})\.json$/;
              const changedEvidencePaths = [...new Set(files.flatMap(file => [file.filename, file.previous_filename]).filter(filePath => evidencePathPattern.test(filePath)))];
              // 生の PR head（月別の直接編集による完了遷移）と仮想 head（最新 base＋PR が追加した申告。古い枝が最新 base の行から作った申告も適用）の両方で選ぶ。
              const virtualHeadTaskList = ledgerChange.virtualHead;
              const selectedEvidencePaths = [...new Set([
                ...trustedValidator.selectEvidencePaths(baseTaskList, headTaskList, changedEvidencePaths, { ancestorTaskList }),
                ...trustedValidator.selectEvidencePaths(baseTaskList, virtualHeadTaskList, changedEvidencePaths),
              ])];
              const evidenceByPath = {};
              const evidenceChanged = new Set(changedEvidencePaths.filter(filePath => selectedEvidencePaths.includes(filePath)));
              const evidenceDeleted = new Set(files.flatMap(file => file.status === 'removed' ? [file.filename] : file.previous_filename ? [file.previous_filename] : []).filter(filePath => selectedEvidencePaths.includes(filePath)));
              const evidenceObjects = [];
              for (const filePath of selectedEvidencePaths) {
                const after = await readContent(filePath, headRef);
                if (after !== null) {
                  let parsed;
                  try { parsed = JSON.parse(after); } catch { parsed = null; }
                  evidenceByPath[filePath] = parsed;
                  if (parsed) evidenceObjects.push(parsed);
                } else evidenceByPath[filePath] = null;
              }
              for (const item of evidenceObjects) trustedValidator.validateEvidence(item, item.cmpId, { repository: `${owner}/${repo}` });
              const existingFiles = new Set();
              const evidenceRefs = [];
              for (const item of evidenceObjects) {
                for (const ac of item.acceptanceCriteria || []) for (const check of ac.tests || []) evidenceRefs.push(check.evidence);
                for (const stage of Object.values(item.stages || {})) if (stage && stage.status === 'passed') evidenceRefs.push(stage.evidence);
                for (const regression of item.regressions || []) evidenceRefs.push(regression.redEvidence, regression.greenEvidence);
              }
              const localEvidenceRefs = [...new Set(evidenceRefs.filter(ref => typeof ref === 'string' && !/^https:\/\//i.test(ref)))];
              if (localEvidenceRefs.length) {
                const treeResponse = await github.rest.git.getTree({ owner, repo, tree_sha: headRef, recursive: '1' });
                if (treeResponse.data.truncated) throw new Error('PR head tree was truncated; evidence file existence cannot be verified.');
                const headFiles = new Set(treeResponse.data.tree.filter(entry => entry.type === 'blob').map(entry => entry.path));
                for (const ref of localEvidenceRefs) {
                  if (!ref.startsWith('/') && !ref.startsWith('\\') && !/^[A-Za-z]:/.test(ref) && !ref.split(/[\\/]/).includes('..') && headFiles.has(ref)) existingFiles.add(ref);
                }
              }

              const implementations = {};
              for (const item of evidenceObjects) {
                const prNumber = item.implementation?.pr;
                if (!Number.isInteger(prNumber) || implementations[prNumber]) continue;
                const response = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const implementationPr = response.data;
                // 同じhead SHAから後で開かれた別PRのcheckを混ぜないよう、全check suiteを取得してマージ時点の世代だけで判定する。
                const checkRuns = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: implementationPr.head.sha, filter: 'all', per_page: 100 });
                const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner, repo, ref: implementationPr.head.sha, per_page: 100 });
                const implementationFiles = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
                if (implementationFiles.length !== implementationPr.changed_files) {
                  throw new Error(`Implementation PR #${prNumber} file list is incomplete (${implementationFiles.length}/${implementationPr.changed_files}); scope cannot be inferred.`);
                }
                implementations[prNumber] = {
                  repository: implementationPr.base.repo?.full_name,
                  merged: Boolean(implementationPr.merged_at),
                  sha: implementationPr.head.sha,
                  checks: implementationPr.merged_at ? trustedValidator.summarizeImplementationChecks({ checkRuns, statuses, mergedAt: implementationPr.merged_at }) : [],
                  files: implementationFiles.map(file => ({ filename: file.filename, previous_filename: file.previous_filename, status: file.status })),
                };
              }
              const runs = [];
              for (const item of evidenceObjects) for (const ci of item.ci || []) {
                if (runs.some(run => run.runId === ci.runId)) continue;
                const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: ci.runId });
                runs.push({ runId: ci.runId, repository: response.data.repository?.full_name, sha: response.data.head_sha, conclusion: response.data.conclusion });
              }
              const input = {
                repository: `${owner}/${repo}`, baseTaskList, headTaskList, ancestorTaskList, evidenceByPath,
                evidenceChanged: [...evidenceChanged], evidenceDeleted: [...evidenceDeleted], existingFiles: [...existingFiles],
                implementations, runs,
              };
              const runsById = Object.fromEntries(input.runs.map(run => [run.runId, run]));
              const implementationsByPr = input.implementations;
              trustedValidator.validateCompletionChanges(input.baseTaskList, input.headTaskList, input.evidenceByPath, {
                repository: input.repository,
                ancestorTaskList: input.ancestorTaskList,
                fileExists: filePath => input.existingFiles.includes(filePath),
                evidenceChanged: new Set(input.evidenceChanged),
                evidenceDeleted: new Set(input.evidenceDeleted),
                implementations: implementationsByPr,
                runs: runsById,
              });
              // 仮想 head でも同じく検証する（PR が追加した申告による完了遷移を必ず拾う。最新 base との差なので分岐点は使わない）。
              trustedValidator.validateCompletionChanges(input.baseTaskList, virtualHeadTaskList, input.evidenceByPath, {
                repository: input.repository,
                fileExists: filePath => input.existingFiles.includes(filePath),
                evidenceChanged: new Set(input.evidenceChanged),
                evidenceDeleted: new Set(input.evidenceDeleted),
                implementations: implementationsByPr,
                runs: runsById,
              });
              core.info(`Completion evidence validated for ${selectedEvidencePaths.length} changed/new completion proof(s).`);
            } else {
              core.notice('Completion validator is absent from the trusted base (bootstrap PR); completion evidence validation starts after this PR lands. Registration checks still run.');
            }

            // 登録検査はvalidatorのbootstrap・既存の移行猶予より前に完了証拠検査を通した後に行う。
            if (Date.parse(pull.created_at) < rolloutAt) {
              core.info(`Legacy PR #${pull.number} predates the registration rollout; migration grace applies after completion validation.`);
              return;
            }
            const codeExtensions = /\.(java|kt|kts|gradle|sql|ts|tsx|js|jsx|vue|mjs|cjs|tf|tfvars|hcl|sh|ps1|go|py|rb|php|html|css|scss|sass|less|xml|yml|yaml|json|jsonc|json5|toml|properties|conf|ini|config|env|lock|proto|graphql|bzl|bazel|mk)$/i;
            const codeBasenames = /(^|\/)(Dockerfile(?:\.[^/]*)?|Containerfile(?:\.[^/]*)?|Makefile|GNUmakefile|Justfile|Procfile|\.env(?:\..*)?|\.npmrc|\.nvmrc|\.editorconfig|\.dockerignore|\.gitignore|\.gitattributes|\.gitmodules)$/i;
            const codeFiles = files.map(file => file.filename).filter(filePath => !/^docs\/evidence\/CMP-(?:\d{6}-\d{4}|\d{3})\.json$/.test(filePath) && (codeExtensions.test(filePath) || codeBasenames.test(filePath)));
            if (codeFiles.length === 0) {
              core.info('No code or configuration files changed; Task-List registration is not required.');
              return;
            }
            const references = [...new Set(`${pull.title}\n${pull.body || ''}`.match(/\bCMP-(?:\d{6}-\d{4}|\d{3})\b/g) || [])];
            if (references.length !== 1) {
              core.setFailed(`Code PR must contain exactly one CMP-ID in its title or body; found ${references.length}.`);
              return;
            }
            const cmpId = references[0];
            // 実装 PR は base の実効台帳（申告適用後）で登録済み・実装中であること（申告だけで実装中になった CMP も可。台帳の配置は base 側で判別する）。
            const taskList = await readLedgerAt(pull.base.ref, 'the PR base branch');
            const ledgerRow = taskList.rows.find(item => item.id === cmpId);
            const matchedRow = trustedValidator
              ? trustedValidator.parseTaskList(taskList).byId.get(cmpId)
              : ledgerRow && ledgerLib.splitTableRow(ledgerRow.line).map(cell => cell.trim());
            if (!matchedRow) throw new Error(`${cmpId} must appear exactly once in the task list (docs/task-list.md or docs/task-list/*.md) on ${pull.base.ref}; found 0.`);
            const state = trustedValidator ? matchedRow.state : matchedRow[3]?.replace(/^\*\*(.*)\*\*$/, '$1').trim().replace(/^P[1-5]\s+/, '');
            if (state !== '\u5b9f\u88c5\u4e2d') throw new Error(`${cmpId} must be registered as 実装中 on ${pull.base.ref} (state: ${state || 'missing'}).`);
            core.info(`${cmpId} is registered as 実装中 on ${pull.base.ref}; checked ${codeFiles.length} code/configuration file(s).`);
