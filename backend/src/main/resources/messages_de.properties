# Saeule 3-B: Uebergabe der Rechnungsverantwortung (CMP-260901-1538)
notification.billing.payer_handover.requested.title=Bitte uebernehmen Sie die Rechnungsverantwortung
notification.billing.payer_handover.requested.body=Die derzeit rechnungsverantwortliche Person wird ihr Konto schliessen, daher muss die Uebergabe bestaetigt werden. Das Abrechnungsdatum aendert sich nicht: das neue Abonnement beginnt genau zum Ende der laufenden Abrechnungsperiode.
notification.billing.payer_handover.payment_method_required.title=Eine Zahlungsmethode ist erforderlich
notification.billing.payer_handover.payment_method_required.body=Die Uebergabe konnte nicht bestaetigt werden, da keine gueltige Zahlungsmethode hinterlegt ist. Bitte hinterlegen Sie eine und bestaetigen Sie erneut.
notification.billing.payer_handover.additional_auth_required.title=Zusaetzliche Kartenauthentifizierung erforderlich
notification.billing.payer_handover.additional_auth_required.body=Ihr Kartenherausgeber verlangt weiterhin eine zusaetzliche Authentifizierung. Ohne rechtzeitigen Abschluss schlaegt die Uebergabe fehl.
notification.billing.payer_handover.manual_intervention_required.title=Die Uebergabe der Rechnungsverantwortung erfordert manuelles Eingreifen
notification.billing.payer_handover.manual_intervention_required.body=Die Uebergabe wurde angehalten, weil ein Zustand erkannt wurde, der nicht automatisch aufgeloest werden kann. Ein Betriebsverantwortlicher muss ihn pruefen. Bis zum Abschluss der Pruefung ist fuer diesen Vertrag keine neue Uebergabeanfrage moeglich.

